<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pip's privacy policy</title>
    <link rel="icon" href="../icons/icon32.png" />
    <link rel="stylesheet" href="privacy.css" />
  </head>
  <body>
    <!-- Pip's privacy policy, set as a page of his book: a gilded capital opens it, a painted one opens each section, and the
         vine of a finely bound book runs down its margin (all drawn by content/illum.js). Its texts, English and French, are
         in privacy.js (TEXT). The same files are the page the stores link to: tools/build-site.py copies them to docs/. -->
    <main class="page" id="page">
      <canvas id="deco" aria-hidden="true"></canvas>
      <nav class="lang" id="lang" aria-label="Language">
        <button type="button" data-v="en" lang="en">English</button><button type="button" data-v="fr" lang="fr">Français</button>
      </nav>
      <header>
        <h1 id="title"></h1>
        <p class="sub" id="sub"></p>
        <p class="date" id="date"></p>
      </header>
      <div class="rule"></div>
      <div id="text"></div>
      <footer>
        <div class="rule"></div>
        <p id="foot"></p>
      </footer>
    </main>
    <script src="../content/illum.js"></script>
    <script src="privacy.js"></script>
  </body>
</html>
